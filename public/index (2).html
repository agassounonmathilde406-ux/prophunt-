@sewadebot <!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Prop Hunt</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; height: 100%; touch-action: none; }
  #game-canvas { display: block; width: 100vw; height: 100vh; }

  #joystick-zone, #look-zone {
    position: fixed; bottom: 0; width: 50vw; height: 45vh; z-index: 10;
  }
  #joystick-zone { left: 0; }
  #look-zone { right: 0; }

  #joystick-base {
    position: fixed; width: 100px; height: 100px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
    display: none; z-index: 11; pointer-events: none;
  }
  #joystick-stick {
    position: fixed; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.55);
    display: none; z-index: 12; pointer-events: none;
  }

  #status {
    position: fixed; top: 8px; left: 8px; z-index: 20;
    color: #eee; font-family: system-ui, sans-serif; font-size: 12px;
    background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 8px;
  }
</style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="joystick-zone"></div>
  <div id="look-zone"></div>
  <div id="joystick-base"></div>
  <div id="joystick-stick"></div>
  <div id="status">Connexion…</div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
