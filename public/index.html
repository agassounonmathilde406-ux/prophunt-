<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Prop Hunt 3D</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      touch-action: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Zones tactiles */
    #joystick-zone {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 50vw;
      height: 50vh;
      z-index: 10;
    }

    #look-zone {
      position: fixed;
      top: 0;
      right: 0;
      width: 50vw;
      height: 100vh;
      z-index: 10;
    }

    /* Joystick Visuel */
    #joystick-base {
      position: fixed;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: none;
      z-index: 11;
      pointer-events: none;
    }

    #joystick-stick {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      display: none;
      z-index: 12;
      pointer-events: none;
    }

    /* Interface UI */
    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 12px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    #transform-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 30;
      padding: 14px 24px;
      background: #ff9800;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(255, 152, 0, 0.4);
      display: none;
      cursor: pointer;
    }

    #transform-btn:active {
      background: #e68a00;
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="joystick-zone"></div>
  <div id="look-zone"></div>
  <div id="joystick-base"></div>
  <div id="joystick-stick"></div>

  <div id="status">Connexion en cours…</div>
  <button id="transform-btn">Transform !</button>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js?v=5"></script>
</body>
</html>
